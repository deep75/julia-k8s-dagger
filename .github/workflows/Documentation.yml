name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# Déploiement GitHub Pages « Source : GitHub Actions » (OIDC, pas de token long).
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication Pages à la fois ; on ne coupe pas un déploiement en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Instancier l'environnement docs/
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Construire le site (Documenter → docs/build/)
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_DEBUG: Documenter

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    # Publie uniquement depuis main (les PR ne font que builder/valider).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
