name: Documentation

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

# `deploydocs` pousse le site compilé sur la branche `gh-pages` via le
# GITHUB_TOKEN (suffisant pour un dépôt public — aucune clé SSH à créer).
permissions:
  contents: write
  pull-requests: read
  statuses: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - uses: julia-actions/cache@v2

      - name: Instancier l'environnement docs/
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'

      - name: Construire et déployer (makedocs + deploydocs)
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
